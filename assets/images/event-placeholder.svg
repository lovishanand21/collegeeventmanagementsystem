<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="180" fill="url(#glowGrad)"/>
  <circle cx="650" cy="350" r="220" fill="url(#glowGrad)"/>
  
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- College Cap Icon -->
    <path d="M-60,-20 L0,-50 L60,-20 L0,10 Z" fill="#38bdf8"/>
    <path d="M-40,-5 L-40,25 Q0,45 40,25 L40,-5" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M45,-12 L45,35" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="38" r="5" fill="#f59e0b"/>

    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="1">
      COLLEGE EVENT
    </text>
    <text y="105" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#c7d2fe" letter-spacing="0.5">
      Official Campus Gathering &amp; Competition
    </text>
  </g>
</svg>
