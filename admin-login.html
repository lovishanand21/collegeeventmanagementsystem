<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - CEMS</title>
  <meta name="description" content="Administrative login portal for college event managers and committee members.">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">

      <div class="admin-login-header">
        <div class="admin-logo-badge">🔐</div>
        <h1 class="admin-login-title">Admin Portal</h1>
        <p class="admin-login-subtitle">College Event Management System</p>
      </div>

      <!-- Demo Credentials Helper Callout -->
      <div class="demo-credentials-box">
        <strong>Demo Viva Credentials:</strong>
        <div>Username: <code>admin</code></div>
        <div>Password: <code>admin123</code></div>
        <button 
          type="button" 
          onclick="document.getElementById('admin-username').value='admin'; document.getElementById('admin-password').value='admin123';"
          class="btn btn-secondary btn-sm"
          style="margin-top: 0.5rem; width: 100%;"
        >
          ✨ Auto-fill Demo Credentials
        </button>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-username" class="form-label">Admin Username</label>
          <input 
            type="text" 
            id="admin-username" 
            class="form-control" 
            placeholder="Enter username" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="admin-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="admin-password" 
            class="form-control" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-error" id="admin-login-error" style="margin-bottom: 1rem;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
          Sign In to Admin Dashboard →
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
        <a href="index.html" style="font-size: 0.875rem; color: var(--text-muted); font-weight: 500;">
          ← Back to Student Website
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
